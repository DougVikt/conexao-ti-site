name: Sincronizar fotos dos ADMs

on:
  schedule:
    # todo dia às 06:00 UTC (03:00 no horário de Brasília)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-adms-fotos
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow
        run: pip install --disable-pip-version-check pillow

      - name: Baixar e tratar fotos
        run: python scripts/sync-adms-fotos.py

      - name: Commitar apenas se alguma foto mudou
        run: |
          if git diff --quiet -- main/img/adms; then
            echo "Nenhuma foto mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/img/adms
          git commit -m "chore(adms): sincronizar fotos de perfil das redes sociais"
          git push
